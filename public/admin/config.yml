backend:
  name: git-gateway
  branch: main # Branch to update

media_folder: "public/assets/uploads" # Media files will be stored in the repo under public/assets/uploads
public_folder: "/assets/uploads" # The src attribute for uploaded media will begin with /assets/uploads

collections:
  - name: "events_data"
    label: "Events Data"
    folder: "src/data/events"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "ID/Slug", name: "id", widget: "string"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "string"}
      - {label: "Images", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}

  - name: "pages"
    label: "Pages"
    files:
      - file: "src/data/pages/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Hero Eyebrow", name: "heroEyebrow", widget: "string"}
          - {label: "Hero Title Part 1", name: "heroTitle1", widget: "string"}
          - {label: "Hero Title Highlight", name: "heroTitleHighlight", widget: "string"}
          - {label: "Hero Title Part 2", name: "heroTitle2", widget: "string"}
          - {label: "Hero Description", name: "heroDescription", widget: "text"}
          - {label: "Stats", name: "stats", widget: "list", fields: [{label: "Label", name: "label", widget: "string"}, {label: "Value", name: "value", widget: "string"}, {label: "Icon (Lucide name)", name: "icon", widget: "string"}]}
          - {label: "Clientele Eyebrow", name: "clienteleEyebrow", widget: "string"}
          - {label: "Clientele Title", name: "clienteleTitle", widget: "string"}
          - {label: "Clients", name: "clients", widget: "list", fields: [{label: "Name", name: "name", widget: "string"}, {label: "Logo URL", name: "logo", widget: "string"}]}
      - file: "src/data/pages/about.json"
        label: "About Page"
        name: "about"
        fields:
          - {label: "Eyebrow", name: "eyebrow", widget: "string"}
          - {label: "Title Part 1", name: "title1", widget: "string"}
          - {label: "Title Highlight", name: "titleHighlight", widget: "string"}
          - {label: "Title Part 2", name: "title2", widget: "string"}
          - {label: "Paragraph 1", name: "paragraph1", widget: "text"}
          - {label: "Paragraph 2", name: "paragraph2", widget: "text"}
          - {label: "Paragraph 3 (Highlighted)", name: "paragraph3", widget: "text"}
          - {label: "Image URL", name: "image", widget: "string"}
      - file: "src/data/pages/models.json"
        label: "Models Page"
        name: "models"
        fields:
          - {label: "Eyebrow", name: "eyebrow", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Call to Action Text", name: "ctaText", widget: "string"}
          - {label: "Call to Action Link", name: "ctaLink", widget: "string"}
          - {label: "Models List", name: "models", widget: "list", fields: [{label: "Name", name: "name", widget: "string"}, {label: "Title/Role", name: "title", widget: "string"}, {label: "Cover Image", name: "image", widget: "image"}]}
      - file: "src/data/pages/gallery.json"
        label: "Gallery Page"
        name: "gallery"
        fields:
          - {label: "Eyebrow", name: "eyebrow", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Images", name: "images", widget: "list", fields: [{label: "Image", name: "image", widget: "image"}, {label: "Thumbnail", name: "thumb", widget: "image", required: false}, {label: "Alt Text", name: "alt", widget: "string", required: false}]}
      - file: "src/data/pages/contact.json"
        label: "Contact Page"
        name: "contact"
        fields:
          - {label: "Eyebrow", name: "eyebrow", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Title Highlight", name: "titleHighlight", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}
          - {label: "Google Maps URL", name: "mapUrl", widget: "string"}
          - {label: "Contact Cards", name: "contactCards", widget: "list", fields: [{label: "Icon", name: "icon", widget: "string"}, {label: "Title", name: "title", widget: "string"}, {label: "Lines", name: "lines", widget: "list", field: {label: "Line", name: "line", widget: "string"}}]}
          - {label: "Footer Text Line 1", name: "footerText1", widget: "string"}
          - {label: "Footer Text Line 2", name: "footerText2", widget: "string"}
          - {label: "Stats", name: "stats", widget: "list", fields: [{label: "Icon", name: "icon", widget: "string"}, {label: "Value", name: "value", widget: "string"}, {label: "Label", name: "label", widget: "string"}]}

  - name: "globals"
    label: "Global Settings"
    files:
      - file: "src/data/globals/footer.json"
        label: "Footer Settings"
        name: "footer"
        fields:
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Quick Links", name: "quickLinks", widget: "list", fields: [{label: "Label", name: "label", widget: "string"}, {label: "URL", name: "url", widget: "string"}]}
          - {label: "Contact Email", name: "email", widget: "string"}
          - {label: "Contact Phone", name: "phone", widget: "string"}
          - {label: "Contact Location", name: "location", widget: "string"}
          - {label: "Copyright Text", name: "copyright", widget: "string"}
          - {label: "Legal Links", name: "legalLinks", widget: "list", fields: [{label: "Label", name: "label", widget: "string"}, {label: "URL", name: "url", widget: "string"}]}
      - file: "src/data/globals/navbar.json"
        label: "Navbar Settings"
        name: "navbar"
        fields:
          - {label: "Navigation Links", name: "navLinks", widget: "list", fields: [{label: "Name", name: "name", widget: "string"}, {label: "Path", name: "path", widget: "string"}]}
          - {label: "Social Links", name: "socialLinks", widget: "list", fields: [{label: "Platform", name: "platform", widget: "select", options: ["facebook", "instagram", "youtube"]}, {label: "URL", name: "url", widget: "string"}]}
          - {label: "Call to Action Text", name: "ctaText", widget: "string"}
          - {label: "Call to Action Link", name: "ctaLink", widget: "string"}

  - name: "event_sections"
    label: "Event Sections"
    folder: "src/data/event_sections"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Eyebrow", name: "eyebrow", widget: "string"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Start Year", name: "start", widget: "string"}
      - {label: "End Year", name: "end", widget: "string"}
      - {label: "Footer Text", name: "footer", widget: "string"}
      - {label: "Items (Event Slugs)", name: "items", widget: "list", field: {label: "Event ID", name: "event_id", widget: "string"}}
